<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A multimedia gallery with audio, video, maps, and images">
    <title>Multimedia Gallery</title>
</head>
<body>

    <!-- ======================================= -->
    <!-- TODO 1: PAGE HEADER & NAVIGATION -->
    <!-- ======================================= -->
    <header>
        <h1>Multimedia Gallery</h1>
        <nav aria-label="Gallery navigation">
            <ul>
                <li><a href="#audio">Audio</a></li>
                <li><a href="#video">Video</a></li>
                <li><a href="#map">Map</a></li>
                <li><a href="#gallery">Gallery</a></li>
            </ul>
        </nav>
    </header>

    <br>

    <main>

        <!-- ======================================= -->
        <!-- TODO 2: AUDIO SECTION -->
        <!-- ======================================= -->
        <section id="audio">
            <h2>Audio Player</h2>
            <figure>
                <audio controls>
                    <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
                <figcaption>Sample audio track - "Free HTML5 Audio Sample"</figcaption>
            </figure>
        </section>

        <br>

        <!-- ======================================= -->
        <!-- TODO 3: VIDEO SECTION -->
        <!-- ======================================= -->
        <section id="video">
            <h2>Video Player</h2>
            <figure>
                <video controls width="640" 
                       poster="https://via.placeholder.com/640x360">
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                    Your browser does not support the video element.
                </video>
                <figcaption>Sample video - "Big Buck Bunny Trailer"</figcaption>
            </figure>
        </section>

        <br>

        <!-- ======================================= -->
        <!-- TODO 4: MAP SECTION -->
        <!-- ======================================= -->
        <section id="map">
            <h2>Our Location</h2>
            <figure>
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3403.4862217643194!2d34.3518!3d31.4167!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzHCsDI1JzAwLjAiTiAzNDDCsDIxJzA2LjQiRQ!5e0!3m2!1sen!2sus!4v1600000000000!5m2!1sen!2sus"
                  width="600" height="400"
                  style="border:0;"
                  allowfullscreen=""
                  loading="lazy"
                  title="Map showing Al-Aqsa University location"
                ></iframe>
                <figcaption>Al-Aqsa University, Gaza, Palestine</figcaption>
            </figure>
        </section>

        <br>

        <!-- ======================================= -->
        <!-- TODO 5: IMAGE GALLERY SECTION -->
        <!-- ======================================= -->
        <section id="gallery">
            <h2>Image Gallery</h2>

            <figure>
                <img src="https://via.placeholder.com/400x300" 
                     alt="Placeholder image showing tech workspace" width="400">
                <figcaption>Image 1: Modern Tech Workspace</figcaption>
            </figure>

            <figure>
                <img src="https://via.placeholder.com/400x300" 
                     alt="Placeholder image showing code lines on a screen" width="400">
                <figcaption>Image 2: Clean Code and Development</figcaption>
            </figure>

            <figure>
                <img src="https://via.placeholder.com/400x300" 
                     alt="Placeholder image showing a laptop and coffee cup" width="400">
                <figcaption>Image 3: Laptop and Coffee Setup</figcaption>
            </figure>

            <figure>
                <img src="https://via.placeholder.com/400x300" 
                     alt="Placeholder image showing web design wireframes" width="400">
                <figcaption>Image 4: Web Design and Wireframing</figcaption>
            </figure>
        </section>

    </main>

    <br>

    <!-- ======================================= -->
    <!-- TODO 6: FOOTER -->
    <!-- ======================================= -->
    <footer>
        <p>&copy; 2026 Multimedia Gallery. All rights reserved.</p>
        <address>
            Created by <a href="mailto:abdalazeezjabari@gmail.com">AbdalAzeez Jabari</a>
        </address>
    </footer>

</body>
</html>
